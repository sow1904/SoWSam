<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoWSam 삼국지</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">SoWSam <span>삼국지</span></div>
    <div id="status"></div>
    <div class="actions">
      <button data-action="forces">세력 정보</button>
      <button data-action="court">황실</button>
      <button data-action="save">저장</button>
      <button data-action="title">타이틀</button>
      <div id="clock">
        <button id="clockPlay" class="primary" data-action="togglePause" title="시간 흐름 / 일시정지 (Space)">▶ 진행</button>
        <button class="spd" data-action="speed" data-s="0" title="1개월 8초 (키 1)">1×</button>
        <button class="spd" data-action="speed" data-s="1" title="1개월 4초 (키 2)">2×</button>
        <button class="spd" data-action="speed" data-s="2" title="1개월 2초 (키 3)">4×</button>
        <button class="spd" data-action="speed" data-s="3" title="1개월 0.5초, 1년 6초 (키 4)">16×</button>
        <button data-action="clockSettings" title="자동 일시정지 설정">⚙</button>
      </div>
    </div>
  </header>
  <main>
    <section id="mapWrap"><svg id="map" viewBox="0 0 2060 1840" aria-label="지도"></svg><div id="battles"></div><div id="pauseBadge" class="hidden">일시정지</div></section>
    <aside id="panel"></aside>
  </main>
  <section id="log"></section>
  <div id="modal" class="hidden"><div class="box"></div></div>
  <div id="toast" class="hidden"></div>

  <script src="js/data/map190.js"></script>
  <script src="js/data/people.js"></script>
  <script src="js/data/abilities.js"></script>
  <script src="js/data/traits.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/scenario191.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/march.js"></script>
  <script src="js/forts.js"></script>
  <script src="js/court.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
