<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoW 삼국지</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="bar1">
      <div class="brand"><span class="seal">SoW</span><b>삼국지</b></div>
      <div id="status"></div>
    </div>
    <div class="bar2">
      <nav id="menu">
        <button data-action="forces" title="세력 일람 (F)"><i>勢</i>세력</button>
        <button data-action="cities" title="내 도시 일람 (C)"><i>城</i>도시</button>
        <button data-action="officers" title="내 무장 일람 (G)"><i>將</i>무장</button>
        <button data-action="diplomacy" title="외교 (D)"><i>交</i>외교</button>
        <button data-action="court" title="황실 (H)"><i>帝</i>황실</button>
        <button data-action="tech" title="기술 (T)"><i>技</i>기술</button>
        <button data-action="system" title="저장, 시간 설정, 타이틀"><i>錄</i>기록</button>
      </nav>
      <div id="clock">
        <button id="clockPlay" class="primary" data-action="togglePause" title="시간 흐름 / 일시정지 (Space)">▶ 진행</button>
        <button class="spd" data-action="speed" data-s="0" title="1개월 8초 (키 1)">1×</button>
        <button class="spd" data-action="speed" data-s="1" title="1개월 4초 (키 2)">2×</button>
        <button class="spd" data-action="speed" data-s="2" title="1개월 2초 (키 3)">4×</button>
        <button class="spd" data-action="speed" data-s="3" title="1개월 0.5초, 1년 6초 (키 4)">16×</button>
        <button data-action="clockSettings" title="자동 일시정지 설정">⚙</button>
      </div>
    </div>
  </header>
  <main>
    <aside id="panel"><div id="panelInfo"></div><h3 class="logh">전황</h3><section id="log"></section></aside>
    <section id="mapWrap"><svg id="map" viewBox="0 0 2060 1840" aria-label="지도"></svg><div id="battles"></div><div id="pauseBadge" class="hidden">일시정지</div><div id="cityWin" class="hidden"></div></section>
  </main>
  <div id="modal" class="hidden"><div class="box"></div></div>
  <div id="toast" class="hidden"></div>

  <script src="js/data/map.js"></script>
  <script src="js/data/people.js"></script>
  <script src="js/data/abilities.js"></script>
  <script src="js/data/traits.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/scenario191.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/march.js"></script>
  <script src="js/units.js"></script>
  <script src="js/tech.js"></script>
  <script src="js/capital.js"></script>
  <script src="js/forts.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/court.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui/core.js"></script>
  <script src="js/ui/map.js"></script>
  <script src="js/ui/panel.js"></script>
  <script src="js/ui/commands.js"></script>
  <script src="js/ui/clock.js"></script>
  <script src="js/ui/screens.js"></script>
  <script src="js/ui/main.js"></script>
</body>
</html>
