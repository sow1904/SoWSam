<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoWSam 삼국지</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">SoWSam <span>삼국지</span></div>
    <div id="status"></div>
    <div class="actions">
      <button data-action="forces">세력 정보</button>
      <button data-action="save">저장</button>
      <button data-action="title">타이틀</button>
      <button class="primary" data-action="endTurn">턴 종료</button>
    </div>
  </header>
  <main>
    <section id="mapWrap"><svg id="map" viewBox="0 0 1000 720" aria-label="지도"></svg></section>
    <aside id="panel"></aside>
  </main>
  <section id="log"></section>
  <div id="modal" class="hidden"><div class="box"></div></div>
  <div id="toast" class="hidden"></div>

  <script src="js/data/cities.js"></script>
  <script src="js/data/scenario190.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
